[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "hsmm"
version = "0.1.0"
description = "Explicit-duration hidden semi-Markov model engine (C++ core, nanobind)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "scipy"]

[tool.scikit-build]
wheel.packages = ["python/hsmm"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
